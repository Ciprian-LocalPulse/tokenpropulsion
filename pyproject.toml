[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tokenpropulsion"
version = "1.0.0rc1"
description = "Less input. Measurable savings. Verified behavior."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ciprian Ștefan Pleșca"}]
keywords = ["llm", "prompt", "optimization", "grok", "tokenization"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ciprian-LocalPulse/tokenpropulsion"
Repository = "https://github.com/Ciprian-LocalPulse/tokenpropulsion"
Documentation = "https://github.com/Ciprian-LocalPulse/tokenpropulsion/blob/main/README.md"
Issues = "https://github.com/Ciprian-LocalPulse/tokenpropulsion/issues"

[project.optional-dependencies]
xai = ["xai-sdk>=1.20,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<3", "build>=1.2,<2", "pip-audit>=2.8,<3", "bandit>=1.8,<2", "httpx>=0.28,<1"]

[project.scripts]
tokenpropulsion = "tokenpropulsion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenpropulsion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["tokenpropulsion"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/tokenpropulsion"]

[[tool.mypy.overrides]]
module = ["xai_sdk.*", "grpc.*"]
ignore_missing_imports = true
