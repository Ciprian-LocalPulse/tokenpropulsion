name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@ec52d0af729a7c50ced4261d17a07916f43f5b8e
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,api,xai,tokenizers]'
      - run: python -m bandit -r src
      - run: python -m pip_audit
      - run: python scripts/secret_scan.py
